version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - gosec
  settings:
    gosec:
      excludes:
        - G104 # errors explicitly ignored with _ are reviewed
        - G115 # integer conversions are bounded
    # Architecture rules (Technical Doc §4.2) — mirrored by internal/archtest.
    depguard:
      rules:
        kernel:
          files: ["**/internal/kernel/**"]
          deny:
            - { pkg: "oneclub/internal/platform", desc: "kernel must not import modules" }
            - { pkg: "oneclub/internal/app", desc: "kernel must not import the composition root" }
        platform:
          files: ["**/internal/platform/**"]
          deny:
            - { pkg: "oneclub/internal/golf", desc: "platform must not depend on business modules; use domain events" }
            - { pkg: "oneclub/internal/billing", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/commercial", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/crm", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/membership", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/sportclub", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/reservation", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/procurement", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/reporting", desc: "platform must not depend on business modules" }
            - { pkg: "oneclub/internal/app", desc: "only cmd wires the application" }
        # Layers: business line → shared core → customer → back office →
        # foundation. Upward dependencies use domain events.
        shared-core:
          files: ["**/internal/membership/**", "**/internal/reservation/**", "**/internal/commercial/**", "**/internal/billing/**"]
          deny:
            - { pkg: "oneclub/internal/golf", desc: "shared core must not depend on a business line; use domain events" }
            - { pkg: "oneclub/internal/sportclub", desc: "shared core must not depend on a business line" }
            - { pkg: "oneclub/internal/app", desc: "only cmd wires the application" }
        customer:
          files: ["**/internal/crm/**"]
          deny:
            - { pkg: "oneclub/internal/golf", desc: "crm must not depend on upper layers; use domain events" }
            - { pkg: "oneclub/internal/membership", desc: "crm must not depend on upper layers" }
            - { pkg: "oneclub/internal/billing", desc: "crm must not depend on upper layers" }
            - { pkg: "oneclub/internal/commercial", desc: "crm must not depend on upper layers" }
            - { pkg: "oneclub/internal/reservation", desc: "crm must not depend on upper layers" }
            - { pkg: "oneclub/internal/app", desc: "only cmd wires the application" }
        reporting:
          files: ["**/internal/reporting/**"]
          deny:
            - { pkg: "oneclub/internal/golf", desc: "reporting reads read models only" }
            - { pkg: "oneclub/internal/membership", desc: "reporting reads read models only" }
            - { pkg: "oneclub/internal/billing", desc: "reporting reads read models only" }
            - { pkg: "oneclub/internal/commercial", desc: "reporting reads read models only" }
            - { pkg: "oneclub/internal/crm", desc: "reporting reads read models only" }
            - { pkg: "oneclub/internal/reservation", desc: "reporting reads read models only" }
            - { pkg: "oneclub/internal/app", desc: "only cmd wires the application" }
  exclusions:
    # Unchecked Close/Flush/Remove/print errors are idiomatic in defer paths.
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable: [gofmt, goimports]
