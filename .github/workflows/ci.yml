# CI (Technical Doc §12.2, FR-TEC-09). Every pull request and every push to
# main runs lint, unit, integration, OpenAPI and frontend checks plus the
# browser acceptance tests. Pushes to main additionally build and scan the
# images (GitHub Container Registry unless vars.REGISTRY is set) and deploy to
# Dev once the Dev server is configured (vars.DEV_INSTANCE).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
  REGISTRY: ${{ vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: golangci-lint (incl. depguard architecture rules)
        uses: golangci/golangci-lint-action@v8
        with: { version: v2.14.0 }

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Unit + architecture tests
        run: go test -race -count=1 ./internal/...

      - name: Migrations on an empty database (twice, to prove idempotency)
        run: go test -count=1 ./internal/platform/provision/...

      - name: Integration / acceptance tests (real PostgreSQL)
        env: { ONECLUB_TEST_ADMIN_URL: "${{ env.ADMIN_URL }}" }
        run: go test -count=1 -timeout 20m ./test/e2e/...

      - name: OpenAPI is regenerated and committed (no drift)
        run: |
          go run ./cmd/oneclub openapi -o "$RUNNER_TEMP/openapi.json"
          diff -u api/openapi/openapi.json "$RUNNER_TEMP/openapi.json" || {
            echo "::error::api/openapi/openapi.json is stale — run 'make openapi' and commit the result"; exit 1; }

      # A response enum gaining a value is a warning: phases add states, every
      # client is generated from this repository and the UI renders unknown
      # states. Intentional contract changes are listed, after review, in
      # .github/oasdiff/err-ignore.txt.
      - name: OpenAPI breaking-change check against the target branch
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:api/openapi/openapi.json" > "$RUNNER_TEMP/base.json" || exit 0
          go run github.com/oasdiff/oasdiff@latest breaking "$RUNNER_TEMP/base.json" api/openapi/openapi.json --fail-on ERR \
            --severity-levels .github/oasdiff/severity-levels.txt --err-ignore .github/oasdiff/err-ignore.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: API client is generated from the committed OpenAPI (no drift)
        run: |
          pnpm --filter @oneclub/api-client generate
          git diff --exit-code packages/api-client/src/schema.ts || {
            echo "::error::schema.ts is stale — run 'make openapi' and commit the result"; exit 1; }
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

  # Browser acceptance tests of every shell against a real stack (PRD EP-12).
  browser:
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Build
        run: |
          go build -o bin/oneclub ./cmd/oneclub
          cd web && pnpm install --frozen-lockfile && pnpm -r build
      - name: Start stack (instance + demo data + api/worker + shells)
        run: bash .github/scripts/browser-stack.sh
      - name: Playwright
        working-directory: web
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oneclub_mgcc
        run: pnpm e2e
      - name: Upload logs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e
          path: |
            var/ci-logs/
            web/test-results/
          retention-days: 7

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend, frontend, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/oneclub:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/oneclub:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Push backend image
        run: docker push "$REGISTRY/oneclub:${{ github.sha }}"
      - name: Build static shells image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          target: static
          tags: ${{ env.REGISTRY }}/oneclub-static:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          target: web
          tags: ${{ env.REGISTRY }}/oneclub-web:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=web

  deploy-dev:
    if: vars.DEV_INSTANCE != ''
    needs: [images]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to Dev (automatic)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: deploy
          key: ${{ secrets.DEV_SSH_KEY }}
          script: /srv/oneclub/scripts/deploy.sh ${{ vars.DEV_INSTANCE }} ${{ github.sha }}
