# Release (Technical Doc §12.2): tag vX.Y.Z → Staging + E2E → Production per
# instance with manual approval (GitHub environment protection rules).
# VPS images are built obfuscated (garble) and without source maps
# (Technical Doc §9.4 — obfuscation only for VPS deploys).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Backend (obfuscated with garble)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            VERSION=${{ github.ref_name }}
            OBFUSCATE=true
            GARBLE_SEED=${{ secrets.GARBLE_SEED }}
          tags: ${{ vars.REGISTRY }}/oneclub:${{ github.ref_name }}
          push: true
      - name: Static shells (no source maps)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          target: static
          build-args: SOURCEMAPS=false
          tags: ${{ vars.REGISTRY }}/oneclub-static:${{ github.ref_name }}
          push: true
      - name: Website (no source maps)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          target: web
          build-args: SOURCEMAPS=false
          tags: ${{ vars.REGISTRY }}/oneclub-web:${{ github.ref_name }}
          push: true
      - name: Release notes from commits
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  staging:
    needs: [images]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: /srv/oneclub/scripts/deploy.sh ${{ vars.STAGING_INSTANCE }} ${{ needs.images.outputs.version }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: E2E against Staging (obfuscated build)
        working-directory: web
        env:
          E2E_BASE_URL: ${{ vars.STAGING_BACKOFFICE_URL }}
          E2E_PASSWORD: ${{ secrets.STAGING_DEMO_PASSWORD }}
        run: corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e

  production:
    needs: [images, staging]
    runs-on: ubuntu-latest
    environment: production   # requires manual approval
    strategy:
      max-parallel: 1
      matrix:
        instance: ${{ fromJSON(vars.PRODUCTION_INSTANCES) }}
    steps:
      - name: Deploy ${{ matrix.instance }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: /srv/oneclub/scripts/deploy.sh ${{ matrix.instance }} ${{ needs.images.outputs.version }}
