<section class="page-cover sm">
    <figure>
        <img src="/themes/modern-golf/assets/images/banks/golf-course-cover.jpg" alt="">
    </figure>
    <div class="text regular-txt">
        <h2>Contact</h2>
        <div class="breadcrumb">
            <a href="/{{LANG}}">Home</a> - <a href="/{{LANG}}/contact">Contact</a>
        </div>
    </div>
</section>

<section class="book darker">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-6">
                <form data-request="emptyForm::onFormSubmit" class="book-form">
                    
                    <div class="form-flash" style="margin-bottom:30px;"></div>
                    <div class="columns">
                        <div class="column is-6">
                            <input name="name" type="text" placeholder="Player Name">
                            <label for="">Player Name</label>
                        </div>
                        <div class="column is-6">
                            <input name="email" type="email" placeholder="Email">
                            <label for="">Email</label>
                        </div>
                    </div>
                    <div class="columns">
                        <div class="column is-12">
                            <input name="subject" type="text" placeholder="Subject">
                            <label for="">Subject</label>
                        </div>
                    </div>
                    <div class="columns">
                        <div class="column is-12">
                            <textarea name="message" id="" cols="30" rows="5" placeholder="Message"></textarea>
                            <label for="">Message</label>
                        </div>
                    </div>
                    <div class="columns">
                        <div class="column is-12 has-text-centered">
                            <button class="btn btn-primary">SUBMIT</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
