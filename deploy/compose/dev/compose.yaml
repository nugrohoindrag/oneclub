# Local development dependencies (Technical Doc §12.1 "Local").
#   docker compose -f deploy/compose/dev/compose.yaml up -d
# Then: make provision-dev && make api && make worker
name: oneclub-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  # Captures all e-mail sent in development (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # S3-compatible storage for testing STORAGE_DRIVER=s3 (http://localhost:9001)
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: oneclub
      MINIO_ROOT_PASSWORD: oneclub-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
