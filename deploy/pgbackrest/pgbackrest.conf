# pgBackRest (Technical Doc §7.7): full backup daily, WAL archive continuous
# (PITR), 30 days of PITR + monthly full backups kept 12 months, stored in
# object storage at a different location from the database server.
[global]
repo1-type=s3
repo1-s3-endpoint=${PGBACKREST_S3_ENDPOINT}
repo1-s3-bucket=oneclub-backup
repo1-s3-region=ap-southeast-3
repo1-path=/oneclub
repo1-retention-full-type=time
repo1-retention-full=30
repo1-cipher-type=aes-256-cbc
process-max=4
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail

# Monthly archive copy kept 12 months (separate repository/bucket).
repo2-type=s3
repo2-s3-endpoint=${PGBACKREST_S3_ENDPOINT}
repo2-s3-bucket=oneclub-backup-monthly
repo2-s3-region=ap-southeast-3
repo2-path=/oneclub
repo2-retention-full-type=count
repo2-retention-full=12
repo2-cipher-type=aes-256-cbc

[oneclub]
pg1-path=/var/lib/postgresql/18/docker
